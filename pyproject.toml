[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-arbiter"
version = "0.1.0"
description = "Reproducible, pre-registered evaluation of TypeSafe Jev as a claim verifier (LLM-AggreFact)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "G Achuth" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "rank_bm25>=0.2.2",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
nli = ["torch", "transformers>=4.40"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
