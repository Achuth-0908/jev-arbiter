jev:
  endpoint: "https://openrouter.ai/api/alpha/decisions"
  model: "typesafe/jev-1.13"
  decision_type: "noul"
  repeat_count: 3
  clip_bounds: [0.01, 0.99]
  concurrency_limit: 5
  timeout_seconds: 60
  max_retries: 4
  backoff_factor: 1.5

extractor:
  provider: "openrouter"
  model: "meta-llama/llama-3.1-8b-instruct"
  temperature: 0.0
  max_tokens: 512

candidates:
  - id: "agent_claude"
    provider: "openrouter"
    model: "anthropic/claude-3.5-haiku"
    temperature: 0.7
  - id: "agent_llama"
    provider: "openrouter"
    model: "meta-llama/llama-3.1-70b-instruct"
    temperature: 0.7
  - id: "agent_gemini"
    provider: "openrouter"
    model: "google/gemini-flash-1.5"
    temperature: 0.7
  - id: "agent_mistral"
    provider: "openrouter"
    model: "mistralai/mistral-nemo"
    temperature: 0.7

baselines:
  judge:
    provider: "openrouter"
    model: "meta-llama/llama-3.1-70b-instruct"
    temperature: 0.0
  aggregator:
    provider: "openrouter"
    model: "meta-llama/llama-3.1-70b-instruct"
    temperature: 0.0
  draft_model:
    provider: "openrouter"
    model: "meta-llama/llama-3.1-8b-instruct"
    temperature: 0.0
