# Pre-registered thresholds and validation criteria
# Pre-registration Rule: These thresholds MUST NOT be modified after test set evaluation.

acceptance_threshold: 0.70
abstention_threshold: 0.40
clip_bounds: [0.01, 0.99]

# Gate 1 Criteria (Phase 1: Jev Calibration Probe)
gate1:
  target_auroc_min: 0.75
  target_ece_max: 0.08
  target_brier_max: 0.12
  nondeterminism_divergence_max: 0.03

# Gate 2 Criteria (Phase 3: Calibrated Fusion)
gate2:
  significance_level_alpha: 0.05
  bootstrap_iterations: 1000
  target_accuracy_gain_over_majority_vote: 0.03
  target_selective_accuracy_at_80_coverage: 0.85

# Logistic Fusion Feature Weights (Initialized or pre-registered defaults)
fusion_features:
  - "calibrated_jev_prob"
  - "agent_agreement_ratio"
  - "effective_independent_votes"
  - "mean_self_reported_confidence"
  - "bm25_retrieval_score"

# Phase 1 protocol (pre-registered). Must be registered (python -m src.runs register) before the
# test split is scored. Changing anything in this file after registration invalidates the lock.
phase1:
  calibrators: ["temperature", "isotonic"]
  selection_rule: "lowest_validation_ece"   # chosen on the validation split only, never on test
  n_bins: 10
  # Jev calls per claim. Chosen on calibration+validation data only (test untouched): repeat-1 vs mean-of-3
  # gave identical AUROC (paired diff -0.0004), 0.9% decision flips, and ~1/3 of the cost.
  repeats: 1
  bootstrap_iterations: 1000
  ci_level: 0.95
  cluster_unit: "source_document"           # claims on the same document are resampled together
  pass_rule: "point_estimate_meets_all_gate1_targets"  # CIs are reported alongside, not used to pass
  nondeterminism_probe_n: 100               # calibration-split claims re-queried with a fresh cache salt
  wording_probe_n: 100                      # same claims re-queried with paraphrased instructions
